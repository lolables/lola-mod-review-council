# Taskfile.yml — Review Council project automation
version: '3'

includes:
  lola-eval:
    taskfile: .taskfiles/lola-eval.yml
  test:
    taskfile: .taskfiles/test.yml

vars:
  TEST_DIR: '{{.TEST_DIR | default ".test-output"}}'

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null

  doctor:
    desc: Check every prerequisite is installed and reachable on PATH
    cmd: bash "{{.ROOT_DIR}}/.taskfiles/scripts/doctor.sh"

  test:
    desc: Alias for test:unit — run the module unit suites
    cmds:
      - task: test:unit

  lint:
    desc: Run shellcheck and shfmt over every shell source
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck not found — dnf install ShellCheck | brew install shellcheck"
      - sh: command -v shfmt
        msg: "shfmt not found — go install mvdan.cc/sh/v3/cmd/shfmt@latest"
    cmds:
      # --enable=all turns on the optional checks (SC2310/SC2312 masking,
      # quoting strictness); -S info fails on notes, not just warnings.
      #
      # scripts/ holds operator tools rather than anything the module ships or
      # `task` calls, so it is easy to leave out of a path list and never notice
      # — nothing here fails when it goes unlinted.
      - find module .taskfiles/scripts scripts -name '*.sh' -print0 | xargs -0 shellcheck -x --enable=all -S info
      - shfmt -d module .taskfiles/scripts scripts

  fmt:
    desc: Rewrite every shell source in canonical shfmt style
    preconditions:
      - sh: command -v shfmt
        msg: "shfmt not found — go install mvdan.cc/sh/v3/cmd/shfmt@latest"
    cmd: shfmt -w module .taskfiles/scripts scripts

  check:
    desc: Run all quality gates — lint plus the full test matrix
    cmds:
      - task: lint
      - task: test:all

  clean:
    desc: Remove test output and task cache
    cmds:
      - rm -rf "{{.TEST_DIR}}" .task
