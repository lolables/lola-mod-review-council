name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The mutation layer runs here instead of on every push and pull request; see
  # the matrix below. The schedule runs it against main, and a dispatch runs it
  # against any branch: `gh workflow run test.yml --ref <branch>`.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group: the nightly run and a push to main share a
# ref but run different layers, so neither may cancel the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The five layers are independent — each starts from a clean checkout and
    # shares no state with the others — so running them in one job only made
    # the leg's wall clock their sum. Serially they reached 24m48s on macOS
    # against a 25m limit, and the next commit tipped it over. As separate jobs
    # the leg costs the slowest single layer instead, and a layer that grows
    # can no longer push an unrelated one past the limit.
    #
    # `degraded` and `mutate` are re-runs of the unit suites (three PATH
    # configurations, and one targeted suite per mutation), so they are the two
    # long poles; `unit`, `e2e` and `release` finish in a few minutes.
    #
    # `mutate` runs only on the schedule and on dispatch, and those events run
    # nothing else. At 18–20 minutes per OS it was about twice the next-slowest
    # layer, and a refactor that stops an entry's sed pattern matching fails it
    # (BROKEN) with no defect present. Its lasting job is to notice a guard
    # that has gone slack, which a nightly run does within a day; when an
    # entry is written, run it locally with `task test:mutate`.
    strategy:
      # Always run every leg to completion: a failure in one layer or on one OS
      # should not cancel the others and hide whether it was platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        layer: >-
          ${{ fromJSON(
            (github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch')
            && '["mutate"]'
            || '["unit", "e2e", "release", "degraded"]'
          ) }}
    name: ${{ matrix.layer }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Per layer, not per leg. The slowest layer runs well under half of this;
    # the margin is for runner variance, not for growth. A layer that starts
    # timing out is a signal to split it, not to raise the number.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # The repo-root Brewfile is the single source of truth for this set, so
        # a contributor's `brew bundle` and this step cannot drift apart. It
        # records why each formula is needed — coreutils supplies GNU timeout,
        # which macOS lacks entirely, installed prefixed as `gtimeout` — and why
        # its libexec/gnubin must stay off PATH.
        #
        # Every layer needs it: the module scripts under test call `timeout`
        # via rc-lib.sh, not just the e2e pipeline.
        run: brew bundle install --file=Brewfile

      - name: Install Venom
        # Only the e2e and release layers run venom, and they are the layers
        # that hard-fail without it (`task test:e2e` and `task test:release`
        # have it as a precondition). The others never invoke it, so they skip
        # a download and a checksum.
        #
        # Pinned by tag AND by the SHA-256 of each published asset: ovh/venom
        # publishes no checksum file, and an unverified binary download is an
        # unreviewed dependency running with the workspace mounted. Bump the tag
        # and all three digests together.
        if: matrix.layer == 'e2e' || matrix.layer == 'release'
        env:
          VENOM_VERSION: v1.3.0
          SHA_LINUX_AMD64: 89832ec25e820c605cf0d3c09122e60bad43d13c1724aa6d375ef7109fbfe201
          SHA_DARWIN_ARM64: c2f34f62180e9be2d6813cf1071946b5728f4dc4ddcfc56791dab9d213c52021
          SHA_DARWIN_AMD64: fbabe5a44ef83c454601ccda7d7bec239566c3c8ceae4269411d3f2cea254f7b
        run: |
          set -euo pipefail
          # The digest tool differs by platform and neither name is portable:
          # macOS has no sha256sum, and shasum is a perl script absent from
          # minimal Linux images. Pick it alongside the asset, explicitly.
          case "${RUNNER_OS}-$(uname -m)" in
            Linux-x86_64) asset=venom.linux-amd64;  sha=$SHA_LINUX_AMD64;  verify=(sha256sum -c -) ;;
            macOS-arm64)  asset=venom.darwin-arm64; sha=$SHA_DARWIN_ARM64; verify=(shasum -a 256 -c -) ;;
            macOS-x86_64) asset=venom.darwin-amd64; sha=$SHA_DARWIN_AMD64; verify=(shasum -a 256 -c -) ;;
            *)
              echo "No pinned venom asset for ${RUNNER_OS}-$(uname -m)." >&2
              echo "Add its digest rather than falling back to an unverified download." >&2
              exit 1
              ;;
          esac
          curl -fsSL -o venom "https://github.com/ovh/venom/releases/download/${VENOM_VERSION}/${asset}"
          echo "${sha}  venom" | "${verify[@]}"
          chmod +x venom
          sudo mv venom /usr/local/bin/venom
          venom version

      - name: Install git-cliff
        # Only the release layer needs it. Pinned by tag AND by the SHA-512 of
        # each asset, taken from the .sha512 files git-cliff publishes beside
        # them and re-computed locally on download. Bump the version and all
        # three digests together; .taskfiles/scripts/release-bump.sh names the
        # same version in its install hint.
        if: matrix.layer == 'release'
        env:
          GIT_CLIFF_VERSION: 2.14.2
          SHA_LINUX_AMD64: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
          SHA_DARWIN_ARM64: 6ec30660233fcd73b92e9d888965945b6435d6fcd7120df8d7c0799faa46cf06d563d49de721ccf4387e6d61bdc5b37c8eb73273c7d9a0883b90cd9857c6ad9f
          SHA_DARWIN_AMD64: 4d32c50a010cbff65e46f1f36347c2dd1a20f17efea7b77115d3166146ad467dc803cd07b839fc35e0a6639aa8d1af9eab7cf8f7984bcd819513f46a396ff801
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-gnu; sha=$SHA_LINUX_AMD64;  verify=(sha512sum -c -) ;;
            macOS-arm64)  target=aarch64-apple-darwin;     sha=$SHA_DARWIN_ARM64; verify=(shasum -a 512 -c -) ;;
            macOS-x86_64) target=x86_64-apple-darwin;      sha=$SHA_DARWIN_AMD64; verify=(shasum -a 512 -c -) ;;
            *)
              echo "No pinned git-cliff asset for ${RUNNER_OS}-$(uname -m)." >&2
              echo "Add its digest rather than falling back to an unverified download." >&2
              exit 1
              ;;
          esac
          archive="git-cliff-${GIT_CLIFF_VERSION}-${target}.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${sha}  ${archive}" | "${verify[@]}"
          tar -xzf "${archive}"
          sudo install -m 755 "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          rm -rf "${archive}" "git-cliff-${GIT_CLIFF_VERSION}"
          git-cliff --version

      - name: Run test layer
        # The layer name reaches the shell through the environment rather than
        # through a `${{ }}` splice into the script body. These values are
        # literals from the matrix above and cannot be attacker-controlled
        # today, but a run: block that interpolates an expression into its own
        # source is one edit away from being injectable, and the env form costs
        # nothing.
        #
        # Lint is not run here; the megalinter workflow owns it.
        env:
          LAYER: ${{ matrix.layer }}
        run: task "test:${LAYER}"

  # A single stable check name that summarises the matrix, so branch protection
  # has one thing to require and does not have to enumerate eight job names that
  # change whenever a layer or an OS is added.
  test-result:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        # `needs.test.result` is 'success' only when every matrix leg succeeded;
        # it collapses to 'failure'/'cancelled'/'skipped' otherwise. Comparing
        # against 'success' rather than against 'failure' means a cancelled or
        # skipped matrix fails the gate instead of passing it by omission.
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [[ "${MATRIX_RESULT}" != "success" ]]; then
            echo "Test matrix did not succeed: ${MATRIX_RESULT}" >&2
            exit 1
          fi
          echo "All test layers passed on every OS."
