          run_bump "" >/dev/null
          commit_in "${REPO_DIR}" "fix(cli): stop dropping arguments"
          run_bump "" >/dev/null
          bash "{{.root}}/.taskfiles/scripts/changelog-section.sh" 0.5.1 "${REPO_DIR}/CHANGELOG.md"
          rm -rf "${TEST_DIR}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Add a subcommand"
          - result.systemout ShouldNotContainSubstring "Stop dropping arguments"
          - result.systemout ShouldNotContainSubstring "Seed the scratch checkout"

  - name: task release:bump is wired to the script
    steps:
      - type: exec
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "{{.root}}"
          task --list
          grep -F 'release-bump.sh' .taskfiles/release.yml
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "release:bump"
          - result.systemout ShouldContainSubstring "release-bump.sh"
