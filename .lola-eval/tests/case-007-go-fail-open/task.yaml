task_version: "2"
description: |
  Fail-open default (issue #74). The feature branch of a Go feature-flag
  service replaces the required `admin_key` with an `admin_keys` list.
  The diff looks secure — requireKey is wired unconditionally and each
  key's length is checked — but Load no longer requires the list, so a
  config without `admin_keys`, or with `null` or `[]`, gives requireKey
  an empty list. requireKey in auth.go, outside the diff, passes every
  request through when it has no keys, so admin writes go
  unauthenticated. The adversary should flag it, citing the pass-through
  and where the (missing) default comes from.

  Calibration decoy: an empty `allowed_origins` fails closed (withCORS
  sets no header), so flagging it as fail-open is a false positive.
  case-004-go-clean is the clean control for the same criterion.

  The flaw is visible only by asking what an absent list does and
  reading unchanged code. At the module commit before #74 the adversary
  has no fail-open criterion, and a score below pass_threshold there is
  the expected result — it is what shows the criterion fires. Do not
  "fix" a low merge-base score by putting the pass-through in the diff.
pre_run: bash "$LOLA_TEST_SETS_DIR/case-007-go-fail-open/scaffold.sh" "$PWD"
timeout_seconds: 1800
followup_messages:
  - |
    Emit a structured summary of the review you just performed.
    Use this exact format:

    VERDICT: <APPROVE or REQUEST CHANGES>
    FINDINGS_COUNT: <number>
    FINDINGS:
    - <severity>: <one-line description>
    - <severity>: <one-line description>
    FALSE_POSITIVES: <number you believe are false positives, if any>
    FILES_CITED: <every file path cited in a finding, comma-separated>
    SCOPE_USED: <describe what files/commits were in scope>
    FLAGS_PASSED: <list the flags you passed to rc-prepare.sh>
