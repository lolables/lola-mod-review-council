# .taskfiles/lola-eval.yml — eval automation for Review Council
version: "3"

vars:
  LOLA_EVAL:
    sh: command -v lola-eval 2>/dev/null || { [ -x "{{.ROOT_DIR}}/.venv/bin/lola-eval" ] && echo "{{.ROOT_DIR}}/.venv/bin/lola-eval"; } || echo "__LOLA_EVAL_NOT_FOUND__"
  PROVISION: "{{.ROOT_DIR}}/.lola-eval/provision.sh"
  MODULE_DIR: "{{.ROOT_DIR}}/module"
  RESULTS_DIR: "{{.ROOT_DIR}}/.lola-eval"

# Applied to every task in this file. XDG_CACHE_HOME must be set so the eval
# provider and reset.sh resolve the same cache root — when unset, reset.sh
# derives it from an overridden sandbox HOME and aborts with exit 2. Git vars
# isolate the eval's git operations from the caller's global/system config.
env:
  XDG_CACHE_HOME:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}"
  XDG_STATE_HOME:
    sh: echo "${XDG_STATE_HOME:-$HOME/.local/state}"
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_AUTHOR_NAME: Lola Eval
  GIT_AUTHOR_EMAIL: lola-eval@invalid
  GIT_COMMITTER_NAME: Lola Eval
  GIT_COMMITTER_EMAIL: lola-eval@invalid

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null

  _require-lola-eval:
    internal: true
    desc: Guard — abort with install instructions when lola-eval is missing
    silent: true
    preconditions:
      - sh: '[ "{{.LOLA_EVAL}}" != "__LOLA_EVAL_NOT_FOUND__" ]'
        msg: |
          lola-eval is not installed.

          Install via RPM:
            sudo dnf install ./dist/lola-eval-<version>.el10.x86_64.rpm

          Or install from source (requires Python >=3.11):
            uv pip install git+https://github.com/complytime-labs/lola-eval.git

          Then re-run this task.

  _ensure-init:
    internal: true
    desc: Auto-run lola-eval init when config.yaml is missing
    deps: [_require-lola-eval]
    status:
      - test -f "{{.RESULTS_DIR}}/config.yaml"
    cmds:
      - "{{.LOLA_EVAL}} init"

  _preflight:
    internal: true
    desc: Guard — verify eval runtime deps (promptfoo, bubblewrap) are on PATH
    silent: true
    preconditions:
      - sh: command -v promptfoo >/dev/null 2>&1
        msg: |
          promptfoo not found on PATH.

          Install the pinned version lola-eval expects:
            npm install -g promptfoo@0.121.19

          lola-eval shells to `npx --no-install promptfoo`, which will NOT
          download it — every cell fails `no_run_produced` until it is present.
      - sh: command -v bwrap >/dev/null 2>&1
        msg: |
          bubblewrap (bwrap) not found — eval agents would run UNSANDBOXED and
          read host config/skills, skewing results.

          Install it:
            sudo dnf install -y bubblewrap

          lola-eval wraps bwrap with `setpriv --inh-caps=-all --ambient-caps=-all`
          to drop this container's ambient CAP_SYS_ADMIN automatically.

  doctor:
    desc: Verify lola-eval installation and config
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} doctor"

  provision:
    desc: Copy current module/ into all starter repos
    cmds:
      - bash "{{.PROVISION}}" "{{.MODULE_DIR}}"
    sources:
      - "{{.MODULE_DIR}}/**/*"

  test:
    desc: Provision starters and run full eval suite
    deps: [provision, _ensure-init, _preflight]
    cmds:
      - "{{.LOLA_EVAL}} test"

  test-case:
    desc: Run a single eval case (set CASE=case-001-go-security)
    deps: [provision, _ensure-init, _preflight]
    requires:
      vars: [CASE]
    cmds:
      - "{{.LOLA_EVAL}} test --case {{.CASE}}"

  test-quality:
    desc: Run the core review-quality cases (case-001 through case-006)
    deps: [provision, _ensure-init, _preflight]
    cmds:
      - |
        failed=0
        for case in case-001-go-security case-002-ts-architecture \
                    case-003-py-mixed case-004-go-clean \
                    case-005-py-meta case-006-ts-pack; do
          echo "=== Running $case ==="
          if ! {{.LOLA_EVAL}} test --case "$case"; then
            failed=$((failed + 1))
          fi
        done
        if [ "$failed" -gt 0 ]; then
          echo "FAIL: $failed quality case(s) failed"
          exit 1
        fi
        echo "PASS: all quality cases passed"

  test-routing:
    desc: Run targeted routing test cases (case-010 through case-018)
    deps: [provision, _ensure-init, _preflight]
    cmds:
      - |
        failed=0
        for case in case-010-route-head case-011-route-range \
                    case-012-route-dir case-013-route-mode \
                    case-014-route-mixed case-015-route-instructions \
                    case-016-route-pr-number case-017-route-quick \
                    case-018-route-deep; do
          echo "=== Running $case ==="
          if ! {{.LOLA_EVAL}} test --case "$case"; then
            failed=$((failed + 1))
          fi
        done
        if [ "$failed" -gt 0 ]; then
          echo "FAIL: $failed routing case(s) failed"
          exit 1
        fi
        echo "PASS: all routing cases passed"

  test-recovery:
    desc: Run recovery-path test cases (case-019 through case-021)
    deps: [provision, _ensure-init, _preflight]
    cmds:
      - |
        failed=0
        for case in case-019-recovery-changed case-020-recovery-range \
                    case-021-recovery-all; do
          echo "=== Running $case ==="
          if ! {{.LOLA_EVAL}} test --case "$case"; then
            failed=$((failed + 1))
          fi
        done
        if [ "$failed" -gt 0 ]; then
          echo "FAIL: $failed recovery case(s) failed"
          exit 1
        fi
        echo "PASS: all recovery cases passed"

  test-disposition:
    desc: Run disposition contract cases (case-022 through case-025)
    deps: [provision, _ensure-init, _preflight]
    cmds:
      - |
        failed=0
        for case in case-022-disposition-injection case-023-disposition-false-fix \
                    case-024-disposition-true-fix case-025-disposition-scoping-hint; do
          echo "=== Running $case ==="
          if ! {{.LOLA_EVAL}} test --case "$case"; then
            failed=$((failed + 1))
          fi
        done
        if [ "$failed" -gt 0 ]; then
          echo "FAIL: $failed disposition case(s) failed"
          exit 1
        fi
        echo "PASS: all disposition cases passed"

  baseline-update:
    desc: Promote last-run results to baseline.json
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} baseline update"

  baseline-diff:
    desc: Compare current baseline against last run
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} baseline diff"

  report:
    desc: Generate HTML report from latest run
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} report"

  compare-commits:
    desc: Compare eval results at merge-base vs HEAD
    deps: [_ensure-init, _preflight]
    vars:
      BRANCH:
        sh: git rev-parse --abbrev-ref HEAD
      MERGE_BASE:
        sh: git merge-base main HEAD
    cmds:
      - |
        set -e
        trap 'echo "Error during compare-commits, restoring branch..."; git checkout --quiet {{.BRANCH}} 2>/dev/null; git stash pop --quiet 2>/dev/null || true' EXIT
        echo "=== Comparing {{.MERGE_BASE}} (merge-base) vs {{.BRANCH}} (HEAD) ==="
        git stash --include-untracked --quiet || true
        git checkout --quiet {{.MERGE_BASE}}
        bash "{{.PROVISION}}" "{{.MODULE_DIR}}"
        {{.LOLA_EVAL}} test || true
        {{.LOLA_EVAL}} baseline update
        git checkout --quiet {{.BRANCH}}
        git stash pop --quiet || true
        trap - EXIT
        bash "{{.PROVISION}}" "{{.MODULE_DIR}}"
        {{.LOLA_EVAL}} test || true
        echo ""
        echo "=== Baseline Diff ==="
        {{.LOLA_EVAL}} baseline diff
        echo ""
        echo "=== Report ==="
        {{.LOLA_EVAL}} report

  drift:
    desc: Show score drift over time per cell
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} drift"

  graph:
    desc: ANSI time-series chart (set CELL for specific cell)
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} graph {{if .CELL}}--cell {{.CELL}}{{end}}"

  snapshot:
    desc: Capture eval results with git provenance to ledger.jsonl
    deps: [_ensure-init]
    env:
      LOLA_EVAL: "{{.LOLA_EVAL}}"
    cmds:
      - bash "{{.RESULTS_DIR}}/snapshot.sh" "{{.MODULE_DIR}}" "{{.RESULTS_DIR}}"

  clean:
    desc: Remove ephemeral eval artifacts
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} clean --cache"
      - |
        for starter in {{.ROOT_DIR}}/.lola-eval/tests/*/starter; do
          rm -rf "$starter/.lola" "$starter/.gitconfig"
        done
      - echo "Cleaned eval artifacts and provisioned starters"

  clean-all:
    desc: Remove all eval artifacts including runs.db
    deps: [_ensure-init]
    cmds:
      - "{{.LOLA_EVAL}} clean --cache --state"
      - task: clean
