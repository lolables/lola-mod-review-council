          code=0
          out="$(GIT_CLIFF="${TEST_DIR}/absent-git-cliff" ROOT_DIR="${REPO_DIR}" \
            bash "${RELEASE_BUMP}" 0.6.0 </dev/null 2>&1)" || code=$?
          printf '%s\n' "${out}"
          printf 'CODE=%s\n' "${code}"
          printf 'VERSION=%s\n' "$(cat "${REPO_DIR}/VERSION")"
          rm -rf "${TEST_DIR}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "git-cliff not found"
          - result.systemout ShouldContainSubstring "git-cliff.org"
          - result.systemout ShouldContainSubstring "CODE=1"
          - result.systemout ShouldContainSubstring "VERSION=0.5.0"

  - name: the release workflow's notes extraction pulls exactly one section
    steps:
      - type: exec
        script: |
          #!/bin/bash
          set -euo pipefail
          source "{{.root}}/.taskfiles/tests/lib/release-test-helpers.sh"
          init_release_repo "{{.root}}" 0.5.0
          git -C "${REPO_DIR}" tag -a v0.5.0 -m v0.5.0
          commit_in "${REPO_DIR}" "feat(cli): add a subcommand"
          run_bump "" >/dev/null
          commit_in "${REPO_DIR}" "fix(cli): stop dropping arguments"
          run_bump "" >/dev/null
          echo "--- notes for 0.5.2 ---"
          bash "{{.root}}/.taskfiles/scripts/changelog-section.sh" 0.5.2 "${REPO_DIR}/CHANGELOG.md"
          echo "--- notes for 0.5.1 ---"
          bash "{{.root}}/.taskfiles/scripts/changelog-section.sh" 0.5.1 "${REPO_DIR}/CHANGELOG.md"
          echo "--- end ---"
          missing=0
          bash "{{.root}}/.taskfiles/scripts/changelog-section.sh" 9.9.9 "${REPO_DIR}/CHANGELOG.md" >/dev/null 2>&1 || missing=$?
          nofile=0
          bash "{{.root}}/.taskfiles/scripts/changelog-section.sh" 0.5.2 "${TEST_DIR}/absent.md" >/dev/null 2>&1 || nofile=$?
          printf 'MISSING_CODE=%s NOFILE_CODE=%s\n' "${missing}" "${nofile}"
          rm -rf "${TEST_DIR}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Stop dropping arguments"
          - result.systemout ShouldContainSubstring "Add a subcommand"
          - result.systemout ShouldNotContainSubstring "# Changelog"
          - result.systemout ShouldNotContainSubstring "## ["
          - result.systemout ShouldContainSubstring "MISSING_CODE=1 NOFILE_CODE=1"

  - name: the 0.5.2 section does not leak the 0.5.1 entries
    steps:
      - type: exec
        script: |
          #!/bin/bash
          set -euo pipefail
          source "{{.root}}/.taskfiles/tests/lib/release-test-helpers.sh"
          init_release_repo "{{.root}}" 0.5.0
          git -C "${REPO_DIR}" tag -a v0.5.0 -m v0.5.0
          commit_in "${REPO_DIR}" "feat(cli): add a subcommand"
          run_bump "" >/dev/null
          commit_in "${REPO_DIR}" "fix(cli): stop dropping arguments"
          run_bump "" >/dev/null
          bash "{{.root}}/.taskfiles/scripts/changelog-section.sh" 0.5.2 "${REPO_DIR}/CHANGELOG.md"
          rm -rf "${TEST_DIR}"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Stop dropping arguments"
          - result.systemout ShouldNotContainSubstring "Add a subcommand"

  - name: a middle section does not leak the next older release
    steps:
      - type: exec
        script: |
          #!/bin/bash
          set -euo pipefail
          source "{{.root}}/.taskfiles/tests/lib/release-test-helpers.sh"
          init_release_repo "{{.root}}" 0.5.0
