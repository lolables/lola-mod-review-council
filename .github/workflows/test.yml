name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # Always run both legs to completion: a failure on one OS should not
      # cancel the other and hide whether it was platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # coreutils supplies GNU timeout, which macOS lacks entirely. Homebrew
        # installs it prefixed as `gtimeout`; the scripts accept either name.
        run: brew install bash jq coreutils

      - name: Run tests
        run: task test
